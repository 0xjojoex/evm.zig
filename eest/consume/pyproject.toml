[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evmz-eest-consume"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "ethereum-execution",
    "ethereum-execution-testing",
]

[tool.setuptools]
py-modules = [
    "evmz_consumer",
    "evmz_consumer_common",
    "evmz_differential",
    "evmz_fixture_source",
    "evmz_transition_tool",
    "evmz_zkevm_consumer",
]

[tool.uv.sources]
ethereum-execution = { git = "https://github.com/ethereum/execution-specs", rev = "391d8a05d5cb182542ac7e7330c858b6ee03f990" }
ethereum-execution-testing = { git = "https://github.com/ethereum/execution-specs", rev = "391d8a05d5cb182542ac7e7330c858b6ee03f990", subdirectory = "packages/testing" }
