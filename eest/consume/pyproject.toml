[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evmz-eest-consume"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "ethereum-execution",
    "ethereum-execution-testing",
]

[tool.setuptools]
py-modules = [
    "evmz_consumer",
    "evmz_consumer_common",
    "evmz_fixture_source",
    "evmz_zkevm_consumer",
]

[tool.uv.sources]
ethereum-execution = { git = "https://github.com/ethereum/execution-specs", rev = "8ca2f4ceefd83100a4d21d0c33747114278a0bc2" }
ethereum-execution-testing = { git = "https://github.com/ethereum/execution-specs", rev = "8ca2f4ceefd83100a4d21d0c33747114278a0bc2", subdirectory = "packages/testing" }
