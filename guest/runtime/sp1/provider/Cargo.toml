[workspace]

[package]
name = "evmz-sp1-provider"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
ere-platform-sp1 = { git = "https://github.com/eth-act/ere.git", tag = "v0.19.5" }

[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
