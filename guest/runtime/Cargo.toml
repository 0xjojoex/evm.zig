[workspace]
members = [
    "host-protocol",
    "openvm/host",
    "sp1/host",
    "zisk/host",
]
exclude = [
    "openvm/provider",
    "sp1/provider",
    "sp1/provider-builder",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
evmz-guest-host-protocol = { path = "host-protocol" }

# ERE's OpenVM fork moves the stable Plonky3 crates to a Git source so they
# can coexist with SP1's 0.4.3-succinct crates in one Cargo workspace.
openvm-sdk = { git = "https://github.com/han0110/openvm.git", rev = "a391b22ebb5305fa52d3394abfd0810df4baff90", default-features = false }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", rev = "a391b22ebb5305fa52d3394abfd0810df4baff90" }

sp1-core-executor = { git = "https://github.com/succinctlabs/sp1", tag = "v6.6.0" }

zisk-core = { git = "https://github.com/0xPolygonHermez/zisk", rev = "fbbc69bcd2ea9a78d1a438b4a897bc48ff0b00a3" }
zisk-transpiler-riscv = { git = "https://github.com/0xPolygonHermez/zisk", rev = "fbbc69bcd2ea9a78d1a438b4a897bc48ff0b00a3" }
ziskemu = { git = "https://github.com/0xPolygonHermez/zisk", rev = "fbbc69bcd2ea9a78d1a438b4a897bc48ff0b00a3" }
