[workspace]
members = [
    "host-protocol",
    "openvm/host",
    "sp1/host",
    "zisk/host",
]
exclude = [
    "openvm/provider",
    "sp1/provider",
    "sp1/provider-builder",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
evmz-guest-host-protocol = { path = "host-protocol" }

# ERE's OpenVM fork moves the stable Plonky3 crates to a Git source so they
# can coexist with SP1's 0.4.3-succinct crates in one Cargo workspace.
openvm-sdk = { git = "https://github.com/han0110/openvm.git", rev = "f73d411c192153cc5f4dc0f4794944605ec6dc9e", default-features = false }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", rev = "f73d411c192153cc5f4dc0f4794944605ec6dc9e" }

sp1-core-executor = { git = "https://github.com/succinctlabs/sp1", tag = "v6.9.0" }

zisk-core = { git = "https://github.com/0xPolygonHermez/zisk", rev = "1e22630bb7e143c30705a1603ed87cfd3da8c6ec" }
zisk-transpiler-riscv = { git = "https://github.com/0xPolygonHermez/zisk", rev = "1e22630bb7e143c30705a1603ed87cfd3da8c6ec" }
ziskemu = { git = "https://github.com/0xPolygonHermez/zisk", rev = "1e22630bb7e143c30705a1603ed87cfd3da8c6ec" }
