# Manual escape hatch for the fixed 10 GiB repository cache. Normal PR jobs are
# restore-only (or disable setup-zig caching), so cache cleanup is maintenance,
# not part of the pull-request lifecycle.
name: Cache maintenance

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cache-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Drop caches for deleted refs
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Sweep caches for deleted refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | sed 's|^|refs/heads/|')"
          open_prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].number' | sed -e 's|^|refs/pull/|' -e 's|$|/merge|')"
          keep="$(printf '%s\n%s\n' "${live}" "${open_prs}" | sort -u)"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.id)\t\(.ref)"' \
          | while IFS=$'\t' read -r id ref; do
              if grep -Fxq "${ref}" <<< "${keep}"; then
                continue
              fi
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null
              echo "deleted ${id} (${ref})" >> "${GITHUB_STEP_SUMMARY}"
            done

      - name: Report remaining usage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" \
            --jq '"active caches: \(.active_caches_count), "
                  + "size: \((.active_caches_size_in_bytes / 1073741824 * 100 | floor) / 100) GB / 10 GB"' \
            >> "${GITHUB_STEP_SUMMARY}"
