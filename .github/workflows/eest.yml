name: Execution spec tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stateless-trust:
    name: Resolved stateless corpus and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: eest/consume/uv.lock

      - name: Resolve tests-zkevm through execution-specs
        env:
          FIXTURE_CACHE: ${{ runner.temp }}/execution-spec-tests
          GITHUB_TOKEN: ${{ github.token }}
          RESOLVED_MANIFEST: ${{ runner.temp }}/tests-zkevm.json
        run: |
          zig build zkevm-resolve --summary all -- \
            --cache-folder="${FIXTURE_CACHE}" \
            --manifest="${RESOLVED_MANIFEST}"

      - name: Run full stateless corpus
        id: corpus
        continue-on-error: true
        env:
          FIXTURE_CACHE: ${{ runner.temp }}/execution-spec-tests
          RESOLVED_MANIFEST: ${{ runner.temp }}/tests-zkevm.json
        run: |
          set -o pipefail
          input="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "${RESOLVED_MANIFEST}")"
          zig build -Doptimize=ReleaseFast zkevm-consume --summary all -- \
            --input="${input}" \
            --cache-folder="${FIXTURE_CACHE}" \
            --no-html \
            -n 8 \
            -q \
            2>&1 | tee eest-zkevm.log

      - name: Run typed mutation rejection matrix
        id: mutations
        continue-on-error: true
        env:
          RESOLVED_MANIFEST: ${{ runner.temp }}/tests-zkevm.json
        run: |
          set -o pipefail
          zig build -Doptimize=ReleaseFast zkevm-mutations --summary all -- \
            --corpus-manifest "${RESOLVED_MANIFEST}" \
            2>&1 | tee eest-zkevm-mutations.log

      - name: Require stateless trust lanes
        if: always()
        env:
          CORPUS_OUTCOME: ${{ steps.corpus.outcome }}
          MUTATIONS_OUTCOME: ${{ steps.mutations.outcome }}
        run: |
          test "${CORPUS_OUTCOME}" = success
          test "${MUTATIONS_OUTCOME}" = success

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eest-stateless-logs
          path: |
            eest-zkevm.log
            eest-zkevm-mutations.log
            .zig-cache/eest-consume/zkevm-logs/
          if-no-files-found: ignore
          retention-days: 7

  execution-fixtures:
    name: execution-specs direct conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: eest/consume/uv.lock

      - name: Run state and BlockSTF fixtures through consume direct
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          zig build -Doptimize=ReleaseFast eest-consume --summary all -- \
            --cache-folder=${{ runner.temp }}/execution-spec-tests \
            --no-html \
            -n 8 \
            -q \
            2>&1 | tee eest-consume.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eest-execution-logs
          path: |
            eest-consume.log
            .zig-cache/eest-consume/logs/
          if-no-files-found: ignore
          retention-days: 7

  consensus-ssz:
    name: Consensus SSZ conformance and sidecar tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512

      - name: Run consensus SSZ corpus
        run: |
          set -o pipefail
          zig build -Doptimize=ReleaseFast ssz-conformance --summary all -- --jobs 4 2>&1 | tee eest-ssz.log

      - name: Run EEST sidecar tests
        run: zig build eest-test --summary all

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eest-ssz-log
          path: eest-ssz.log
          if-no-files-found: ignore
          retention-days: 7
