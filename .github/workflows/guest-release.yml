name: Guest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: guest-<track>@vX.Y.Z[-rc.N]
        required: true
        type: string
      dry_run:
        description: Qualify and prepare the guest but skip VK generation, signing, and release creation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: guest-release
  cancel-in-progress: false

env:
  # ere-server-zisk:0.16.2, pinned by digest so the VK provenance is immutable.
  ERE_IMAGE: ghcr.io/eth-act/ere/ere-server-zisk@sha256:4d00a96890a26dc54b523e537e9c1b25a26cf18d166bd3614fc97bbd09317091

jobs:
  qualify:
    name: Qualify ${{ inputs.tag }}
    uses: ./.github/workflows/guest-benchmark.yml
    with:
      release_gate: true
    permissions:
      contents: read

  verify:
    name: Prepare ${{ inputs.tag }}
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      elf-name: ${{ steps.bundle.outputs.elf-name }}
      source-commit: ${{ steps.bundle.outputs.source-commit }}
      evidence-url: ${{ steps.bundle.outputs.evidence-url }}

    steps:
      - name: Checkout qualified source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require qualified source on main
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${SOURCE_COMMIT}" FETCH_HEAD

      - name: Require a new tag
        env:
          TAG: ${{ inputs.tag }}
        run: test -z "$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"

      - name: Download qualified guest
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.qualify.outputs.artifact_name }}
          path: ${{ runner.temp }}/evidence

      - name: Stage tested release bundle
        id: bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/evidence"
          evidence="${source_dir}/guest-evidence/evidence.json"
          report="${source_dir}/guest-evidence/report.md"
          test -s "${evidence}"
          test -s "${report}"
          test "$(jq -er .source_ref "${evidence}")" = "${SOURCE_COMMIT}"

          elf_name="$(jq -er '.guest.elf_name | select(type == "string" and length > 0)' "${evidence}")"
          test "$(basename "${elf_name}")" = "${elf_name}"
          elf="${source_dir}/${elf_name}"
          test -s "${elf}"
          expected_sha="$(jq -er .guest.elf_sha256 "${evidence}")"
          actual_sha="$(sha256sum "${elf}" | cut -d ' ' -f 1)"
          test "${actual_sha}" = "${expected_sha}"

          artifacts="${GITHUB_WORKSPACE}/release-artifacts"
          mkdir -p "${artifacts}"
          install -m 0644 "${elf}" "${artifacts}/${elf_name}"
          install -m 0644 "${evidence}" "${artifacts}/evidence.json"
          install -m 0644 "${report}" "${artifacts}/report.md"
          {
            echo "elf-name=${elf_name}"
            echo "source-commit=${SOURCE_COMMIT}"
            echo "evidence-url=${EVIDENCE_URL}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "## Release evidence"
            echo ""
            echo "- ELF SHA-256: \`${actual_sha}\`"
            echo "- Qualification run: ${EVIDENCE_URL}"
            echo "- Spec: \`$(jq -er .corpus.network "${evidence}")\`"
            echo "- Fixture release: \`$(jq -er .corpus.fixture_release "${evidence}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release bundle
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft ${{ inputs.tag }}
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-artifacts

      - name: Resolve bundle paths
        env:
          ELF_NAME: ${{ needs.verify.outputs.elf-name }}
        run: |
          set -euo pipefail
          echo "ARTIFACTS=${GITHUB_WORKSPACE}/release-artifacts" >> "${GITHUB_ENV}"
          echo "ELF_NAME=${ELF_NAME}" >> "${GITHUB_ENV}"
          test -s "${GITHUB_WORKSPACE}/release-artifacts/${ELF_NAME}"
          test -s "${GITHUB_WORKSPACE}/release-artifacts/evidence.json"
          test -s "${GITHUB_WORKSPACE}/release-artifacts/report.md"

      - name: Free disk space for VK generation
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache

      - name: Generate ZisK verification key
        run: |
          set -euo pipefail
          vk_name="${ELF_NAME%.elf}.vk"
          docker pull "${ERE_IMAGE}"
          docker run --rm \
            -v "${ARTIFACTS}:/output" \
            "${ERE_IMAGE}" \
            --elf-path "/output/${ELF_NAME}" \
            keygen \
            --program-vk-path "/output/${vk_name}"
          test "$(stat -c %s "${ARTIFACTS}/${vk_name}")" -eq 32
          echo "VK_NAME=${vk_name}" >> "${GITHUB_ENV}"

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Hash and sign release assets
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_SECRET_KEY}"
          test -n "${MINISIGN_PUBLIC_KEY}"
          test -n "${MINISIGN_PASSWORD}"
          (
            cd "${ARTIFACTS}"
            sha256sum "${ELF_NAME}" "${VK_NAME}" evidence.json report.md > SHA256SUMS
          )
          secret_key="${RUNNER_TEMP}/minisign.key"
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${secret_key}"
          printf '%s\n' "${MINISIGN_PUBLIC_KEY}" > "${ARTIFACTS}/minisign.pub"
          for file in "${ARTIFACTS}/${ELF_NAME}" "${ARTIFACTS}/${VK_NAME}" "${ARTIFACTS}/SHA256SUMS"; do
            printf '%s\n' "${MINISIGN_PASSWORD}" | minisign \
              -Sm "${file}" \
              -s "${secret_key}" \
              -x "${file}.minisig" \
              -t "$(basename "${file}")"
          done
          rm -f "${secret_key}"

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          EVIDENCE_URL: ${{ needs.verify.outputs.evidence-url }}
        run: |
          set -euo pipefail
          evidence="${ARTIFACTS}/evidence.json"
          notes="${RUNNER_TEMP}/release-notes.md"
          vk_sha="$(sha256sum "${ARTIFACTS}/${VK_NAME}" | cut -d ' ' -f 1)"
          jq -r \
            --arg tag "${TAG}" \
            --arg source "${SOURCE_COMMIT}" \
            --arg run "${EVIDENCE_URL}" \
            --arg image "${ERE_IMAGE}" \
            --arg vk_sha "${vk_sha}" \
            '"ZisK guest pre-release for integration testing.\n\n" +
             "- Spec: " + .corpus.network + "\n" +
             "- Fixture release: " + .corpus.fixture_release + "\n" +
             "- Corpus: " + .corpus.id + "\n" +
             "- Stateless schema: " + .stateless_schema + "\n" +
             "- Source commit: " + $source + "\n" +
             "- Zig: " + .guest.zig_version + "\n" +
             "- ZisK: v" + .guest.backend_version + " (" + .guest.backend_commit + ")\n" +
             "- ZisK Rust toolchain: " + .guest.backend_toolchain + "\n" +
             "- ERE keygen image: " + $image + "\n" +
             "- Benchmark evidence: " + $run + "\n" +
             "- ELF SHA-256: " + .guest.elf_sha256 + "\n" +
             "- VK SHA-256: " + $vk_sha + "\n\n" +
             "The attached ELF is the exact artifact executed by this release qualification run."' \
            "${evidence}" > "${notes}"
          gh release create "${TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_COMMIT}" \
            --title "${TAG}" \
            --notes-file "${notes}" \
            --draft \
            --prerelease \
            "${ARTIFACTS}"/*
