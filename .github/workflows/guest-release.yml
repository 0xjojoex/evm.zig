name: Guest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: guest-<track>@vX.Y.Z[-rc.N]
        required: true
        type: string
      evidence_run_id:
        description: Successful strict Guest benchmark run
        required: true
        type: number
      dry_run:
        description: Validate evidence but skip VK generation, signing, and release creation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: guest-release
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0
  STATELESS_SCHEMA: "0x1501"
  # ere-server-zisk:58ca85b, pinned by digest so the VK provenance is immutable.
  ERE_IMAGE: ghcr.io/eth-act/ere/ere-server-zisk@sha256:a21622ab8a9b2502f40307208b593f500a22373201e9ae37c2558a7eadb52e17

jobs:
  verify:
    name: Verify ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      elf-name: ${{ steps.bundle.outputs.elf-name }}
      source-commit: ${{ steps.run.outputs.source-commit }}
      evidence-url: ${{ steps.run.outputs.run-url }}

    steps:
      - name: Select exact strict benchmark artifact
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r .conclusion <<<"${run}")" = success
          test "$(jq -r .event <<<"${run}")" = workflow_dispatch
          test "$(jq -r .path <<<"${run}")" = .github/workflows/guest-benchmark.yml
          source_commit="$(jq -er .head_sha <<<"${run}")"
          run_attempt="$(jq -er .run_attempt <<<"${run}")"
          artifact_name="guest-zisk-strict-${RUN_ID}-${run_attempt}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          jq -e --arg name "${artifact_name}" \
            '[.artifacts[] | select(.expired | not) | select(.name == $name)] | length == 1' \
            <<<"${artifacts}"
          {
            echo "source-commit=${source_commit}"
            echo "run-url=$(jq -er .html_url <<<"${run}")"
            echo "artifact-name=${artifact_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.run.outputs.source-commit }}
          fetch-depth: 0

      - name: Require tested source on main
        env:
          SOURCE_COMMIT: ${{ steps.run.outputs.source-commit }}
        run: |
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "${SOURCE_COMMIT}" refs/remotes/origin/main

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Download exact evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.evidence_run_id }}
          ARTIFACT_NAME: ${{ steps.run.outputs.artifact-name }}
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence"
          gh run download "${RUN_ID}" \
            --name "${ARTIFACT_NAME}" \
            --dir "${RUNNER_TEMP}/evidence"

      - name: Validate and stage release bundle
        id: bundle
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.run.outputs.source-commit }}
          EVIDENCE_URL: ${{ steps.run.outputs.run-url }}
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/evidence"
          evidence="${source_dir}/guest-evidence/evidence.json"
          report="${source_dir}/guest-evidence/report.md"
          test -s "${evidence}"
          test -s "${report}"
          jq -e \
            --arg source "${SOURCE_COMMIT}" \
            --arg schema "${STATELESS_SCHEMA}" \
            '.schema_version == 1
             and .source_ref == $source
             and .backend == "zisk"
             and .metric == "steps"
             and .stateless_schema == $schema
             and .corpus.mode == "tests-zkevm"
             and ((.corpus.digest // "") | test("^[0-9a-f]{64}$"))
             and ((.corpus.fixture_release // "") | length > 0)
             and ((.guest.elf_sha256 // "") | test("^[0-9a-f]{64}$"))
             and ((.guest.zig_version // "") | length > 0)
             and ((.guest.backend_version // "") | length > 0)
             and ((.guest.backend_commit // "") | test("^[0-9a-f]{40}$"))
             and ((.guest.backend_toolchain // "") | length > 0)
             and .gate.strict == true
             and .gate.passed == true
             and .results.fixture_count == .corpus.expected_fixtures
             and .results.total_steps > 0
             and .results.crashes == 0
             and .results.known_failures == 0
             and .results.unexpected_failures == 0
             and (.results.unexpected_passes | length) == 0
             and (.results.stale_known | length) == 0' \
            "${evidence}"

          elf_name="$(jq -er '.guest.elf_name | select(type == "string" and length > 0)' "${evidence}")"
          test "$(basename "${elf_name}")" = "${elf_name}"
          [[ "${elf_name}" == stateless-validator-evmz-zisk-*.elf ]]
          elf="${source_dir}/${elf_name}"
          test -s "${elf}"
          expected_sha="$(jq -er .guest.elf_sha256 "${evidence}")"
          actual_sha="$(sha256sum "${elf}" | cut -d ' ' -f 1)"
          test "${actual_sha}" = "${expected_sha}"
          zig build check-guest-elf -- --require-rv64im-zicclsm "${elf}"

          [[ "${TAG}" =~ ^guest-[a-z0-9]+(-[a-z0-9]+)*@v([0-9]+)\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          remote_tag="$(git ls-remote --tags origin \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          if [[ -n "${remote_tag}" ]]; then
            tag_commit="$(awk '
              /\^\{\}$/ { peeled=$1 }
              !/\^\{\}$/ { direct=$1 }
              END { if (peeled != "") print peeled; else print direct }
            ' <<<"${remote_tag}")"
            if [[ "${tag_commit}" != "${SOURCE_COMMIT}" ]]; then
              echo "error: ${TAG} already points to ${tag_commit}, not tested source ${SOURCE_COMMIT}" >&2
              exit 1
            fi
          fi
          scope="${TAG#guest-}"
          track="${scope%%@*}"
          fixture_version="${scope#*@v}"
          fixture_version="${fixture_version%-rc.*}"
          network="$(jq -er .corpus.network "${evidence}")"
          fixture_release="$(jq -er .corpus.fixture_release "${evidence}")"
          expected_network="${track}"
          if [[ "${track}" == *-devnet ]]; then
            expected_network="${track}-${fixture_version%%.*}"
            test "${fixture_release}" = "tests-${track}@v${fixture_version}"
          fi
          test "${network}" = "${expected_network}"

          artifacts="${GITHUB_WORKSPACE}/release-artifacts"
          mkdir -p "${artifacts}"
          install -m 0644 "${elf}" "${artifacts}/${elf_name}"
          install -m 0644 "${evidence}" "${artifacts}/evidence.json"
          install -m 0644 "${report}" "${artifacts}/report.md"
          echo "elf-name=${elf_name}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Release evidence"
            echo ""
            echo "- ELF SHA-256: \`${actual_sha}\`"
            echo "- Strict benchmark run: ${EVIDENCE_URL}"
            echo "- Spec: \`${network}\`"
            echo "- Fixture release: \`${fixture_release}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release bundle
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft ${{ inputs.tag }}
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          name: release-bundle
          path: release-artifacts

      - name: Resolve bundle paths
        env:
          ELF_NAME: ${{ needs.verify.outputs.elf-name }}
        run: |
          set -euo pipefail
          echo "ARTIFACTS=${GITHUB_WORKSPACE}/release-artifacts" >> "${GITHUB_ENV}"
          echo "ELF_NAME=${ELF_NAME}" >> "${GITHUB_ENV}"
          test -s "${GITHUB_WORKSPACE}/release-artifacts/${ELF_NAME}"
          test -s "${GITHUB_WORKSPACE}/release-artifacts/evidence.json"
          test -s "${GITHUB_WORKSPACE}/release-artifacts/report.md"

      - name: Free disk space for VK generation
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache

      - name: Generate ZisK verification key
        run: |
          set -euo pipefail
          vk_name="${ELF_NAME%.elf}.vk"
          docker pull "${ERE_IMAGE}"
          docker run --rm \
            -v "${ARTIFACTS}:/output" \
            "${ERE_IMAGE}" \
            --elf-path "/output/${ELF_NAME}" \
            keygen \
            --program-vk-path "/output/${vk_name}"
          test "$(stat -c %s "${ARTIFACTS}/${vk_name}")" -eq 32
          echo "VK_NAME=${vk_name}" >> "${GITHUB_ENV}"

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Hash and sign release assets
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_SECRET_KEY}"
          test -n "${MINISIGN_PUBLIC_KEY}"
          test -n "${MINISIGN_PASSWORD}"
          (
            cd "${ARTIFACTS}"
            sha256sum "${ELF_NAME}" "${VK_NAME}" evidence.json report.md > SHA256SUMS
          )
          secret_key="${RUNNER_TEMP}/minisign.key"
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${secret_key}"
          printf '%s\n' "${MINISIGN_PUBLIC_KEY}" > "${ARTIFACTS}/minisign.pub"
          for file in "${ARTIFACTS}/${ELF_NAME}" "${ARTIFACTS}/${VK_NAME}" "${ARTIFACTS}/SHA256SUMS"; do
            printf '%s\n' "${MINISIGN_PASSWORD}" | minisign \
              -Sm "${file}" \
              -s "${secret_key}" \
              -x "${file}.minisig" \
              -t "$(basename "${file}")"
          done
          rm -f "${secret_key}"

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source-commit }}
          EVIDENCE_URL: ${{ needs.verify.outputs.evidence-url }}
        run: |
          set -euo pipefail
          evidence="${ARTIFACTS}/evidence.json"
          notes="${RUNNER_TEMP}/release-notes.md"
          vk_sha="$(sha256sum "${ARTIFACTS}/${VK_NAME}" | cut -d ' ' -f 1)"
          jq -r \
            --arg tag "${TAG}" \
            --arg source "${SOURCE_COMMIT}" \
            --arg run "${EVIDENCE_URL}" \
            --arg image "${ERE_IMAGE}" \
            --arg vk_sha "${vk_sha}" \
            '"ZisK guest pre-release for integration testing.\n\n" +
             "- Spec: " + .corpus.network + "\n" +
             "- Fixture release: " + .corpus.fixture_release + "\n" +
             "- Corpus: " + .corpus.id + "\n" +
             "- Stateless schema: " + .stateless_schema + "\n" +
             "- Source commit: " + $source + "\n" +
             "- Zig: " + .guest.zig_version + "\n" +
             "- ZisK: v" + .guest.backend_version + " (" + .guest.backend_commit + ")\n" +
             "- ZisK Rust toolchain: " + .guest.backend_toolchain + "\n" +
             "- ERE keygen image: " + $image + "\n" +
             "- Benchmark evidence: " + $run + "\n" +
             "- ELF SHA-256: " + .guest.elf_sha256 + "\n" +
             "- VK SHA-256: " + $vk_sha + "\n\n" +
             "The attached ELF is the exact artifact executed by the strict benchmark run."' \
            "${evidence}" > "${notes}"
          gh release create "${TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_COMMIT}" \
            --title "${TAG}" \
            --notes-file "${notes}" \
            --draft \
            --prerelease \
            "${ARTIFACTS}"/*
