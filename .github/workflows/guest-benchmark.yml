# Guest correctness, execute-only metrics, and release qualification.
name: Guest benchmark

on:
  workflow_call:
    inputs:
      release_gate:
        description: Produce release-qualified evidence
        required: true
        type: boolean
      backend:
        description: Guest backend, or all release backends
        required: true
        type: string
    outputs:
      zisk_artifact_name:
        description: Release-qualified ZisK guest artifact
        value: ${{ jobs.measure.outputs.release_artifact_name }}
      sp1_artifact_name:
        description: Release-qualified SP1 guest artifact
        value: ${{ jobs.sp1.outputs.release_artifact_name }}
      openvm_artifact_name:
        description: Release-qualified OpenVM guest artifact
        value: ${{ jobs.openvm.outputs.release_artifact_name }}
  pull_request:
    paths:
      - build.zig
      - build.zig.zon
      - src/**
      - guest/**
      - eest/**
      - .github/actions/build-zisk-artifacts/**
      - .github/workflows/guest-benchmark.yml
  push:
    branches: [main]
    paths:
      - build.zig
      - build.zig.zon
      - src/**
      - guest/**
      - eest/**
      - .github/actions/build-zisk-artifacts/**
      - .github/workflows/guest-benchmark.yml
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      backend:
        description: Guest backend
        required: true
        default: zisk
        type: choice
        options:
          - zisk
          - sp1
          - openvm

permissions:
  contents: read

concurrency:
  group: guest-benchmark-${{ github.event.pull_request.number || github.ref_name }}-tests-zkevm
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: zisk tests-zkevm
    if: >-
      (github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call')
      || inputs.backend == 'zisk'
      || inputs.backend == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      release_artifact_name: ${{ steps.release-artifact.outputs.name }}
    env:
      RESOLVED_MANIFEST: ${{ github.workspace }}/resolved-manifest.json
      SOURCE_COMMIT: ${{ github.sha }}
      STATELESS_SCHEMA: "0x1501"
      ZIG_VERSION: 0.16.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-key: guest-benchmark-${{ github.event_name }}-tests-zkevm

      - name: Load pinned ZisK version
        run: |
          zig build zisk-config --prefix "${RUNNER_TEMP}/zisk-config" --summary none
          cat "${RUNNER_TEMP}/zisk-config/share/evmz/zisk.env" >> "${GITHUB_ENV}"

      - name: Resolve runner paths
        run: |
          {
            echo "ZISK_HOME=${RUNNER_TEMP}/zisk-sdk"
            echo "ZISK_SOURCE=${RUNNER_TEMP}/zisk-source"
            echo "ZISK_ARTIFACTS=${RUNNER_TEMP}/zisk-artifacts"
            echo "ZISK_CACHE_KEY=zisk-provider-v1-${RUNNER_OS}-${RUNNER_ARCH}-ubuntu-24.04-${ZISK_VERSION}-${ZISK_COMMIT}-${ZISK_RUST_TOOLCHAIN}-${{ hashFiles('.github/actions/build-zisk-artifacts/action.yml') }}"
          } >> "${GITHUB_ENV}"

      # The provider is RISC-V guest code; rebuild the native host for each runner CPU.
      - name: Restore pinned ZisK provider
        id: zisk-provider-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/zisk-artifacts/libziskos_staticlib.a
          key: ${{ env.ZISK_CACHE_KEY }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp10 \
            libomp5-18 \
            libopenmpi3t64 \
            libsodium23

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: eest/consume/uv.lock

      - name: Resolve tests-zkevm through execution-specs
        run: |
          zig build zkevm-resolve --summary all -- \
            --cache-folder="${RUNNER_TEMP}/execution-spec-tests" \
            --manifest="${RESOLVED_MANIFEST}"

      - name: Build pinned ZisK artifacts
        uses: ./.github/actions/build-zisk-artifacts
        with:
          version: ${{ env.ZISK_VERSION }}
          commit: ${{ env.ZISK_COMMIT }}
          rust-toolchain: ${{ env.ZISK_RUST_TOOLCHAIN }}
          zisk-home: ${{ env.ZISK_HOME }}
          source-dir: ${{ env.ZISK_SOURCE }}
          artifacts-dir: ${{ env.ZISK_ARTIFACTS }}
          build-provider: ${{ steps.zisk-provider-cache.outputs.cache-hit != 'true' }}
          build-host: "true"
          host-manifest: ${{ github.workspace }}/guest/runtime/Cargo.toml

      - name: Resolve pinned ZisK artifacts
        id: zisk
        run: |
          host="${ZISK_ARTIFACTS}/evmz-zisk-host"
          provider="${ZISK_ARTIFACTS}/libziskos_staticlib.a"
          test -x "${host}"
          test -s "${provider}"
          {
            echo "host=${host}"
            echo "provider=${provider}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and validate guest
        env:
          PROVIDER: ${{ steps.zisk.outputs.provider }}
          RELEASE_GATE: ${{ inputs.release_gate }}
        run: |
          zig build guest-zisk \
            -Dguest-payload=stateless-ere \
            "-Dstateless-schema=${STATELESS_SCHEMA}" \
            -Doptimize=ReleaseFast \
            "-Dziskos-staticlib=${PROVIDER}" \
            --prefix "${RUNNER_TEMP}/guest" \
            --global-cache-dir "${RUNNER_TEMP}/zig-global-cache" \
            --summary all
          elf="${RUNNER_TEMP}/guest/guest/zisk/evmz-guest-zisk.elf"
          candidate="${GITHUB_WORKSPACE}/stateless-validator-evmz-zisk-${ZISK_VERSION}.elf"
          install -D -m 0644 "${elf}" "${candidate}"
          zig build check-guest-elf -- \
            --require-rv64im-zicclsm \
            --allow-attribute-a \
            --allow-rev8 \
            "${candidate}"
          if [[ "${RELEASE_GATE}" == true ]]; then
            zig build guest-zisk \
              -Dguest-payload=exit-failure-probe \
              -Doptimize=ReleaseFast \
              "-Dziskos-staticlib=${PROVIDER}" \
              --prefix "${RUNNER_TEMP}/failure-probe" \
              --global-cache-dir "${RUNNER_TEMP}/zig-global-cache" \
              --summary all
            zig build check-zisk-failure-status -- --expect-no-propagation \
              "${{ steps.zisk.outputs.host }}" \
              "${RUNNER_TEMP}/failure-probe/guest/zisk/evmz-guest-zisk.elf"
          fi
          echo "CANDIDATE_ELF=${candidate}" >> "${GITHUB_ENV}"

      - name: Report ZisK runtime identity
        env:
          GUEST_HOST: ${{ steps.zisk.outputs.host }}
          PROVIDER: ${{ steps.zisk.outputs.provider }}
        run: |
          mkdir -p guest-evidence
          {
            uname -a
            lscpu | grep -E '^(Architecture|Model name|Vendor ID|CPU family|Model|Stepping|Flags):'
            sha256sum "${GUEST_HOST}" "${PROVIDER}" "${CANDIDATE_ELF}"
          } | tee guest-evidence/runtime.txt

      - name: Run corpus and produce evidence
        env:
          GUEST_HOST: ${{ steps.zisk.outputs.host }}
          RELEASE_GATE: ${{ inputs.release_gate }}
        run: |
          args=(
            --executor zisk
            --jobs "$(nproc)"
            --zisk-host "${GUEST_HOST}"
            --zisk-elf "${CANDIDATE_ELF}"
            --evidence-dir "${GITHUB_WORKSPACE}/guest-evidence"
            --corpus-manifest "${RESOLVED_MANIFEST}"
            --source-ref "${SOURCE_COMMIT}"
            --stateless-schema "${STATELESS_SCHEMA}"
            --zig-version "${ZIG_VERSION}"
            --backend-version "${ZISK_VERSION}"
            --backend-commit "${ZISK_COMMIT}"
            --backend-toolchain "${ZISK_RUST_TOOLCHAIN}"
          )
          if [[ "${RELEASE_GATE}" == true ]]; then
            args+=(--strict-evidence)
          fi
          zig build -Doptimize=ReleaseFast zkevm --summary all -- "${args[@]}"

      - name: Publish job summary
        if: always() && hashFiles('guest-evidence/report.md') != ''
        run: cat guest-evidence/report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload diagnostic evidence
        if: always() && !inputs.release_gate
        uses: actions/upload-artifact@v7
        with:
          name: guest-zisk-tests-zkevm-${{ github.run_id }}-${{ github.run_attempt }}
          path: guest-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Name release evidence
        id: release-artifact
        if: success() && inputs.release_gate
        run: echo "name=guest-zisk-strict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload strict release evidence
        if: success() && inputs.release_gate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-artifact.outputs.name }}
          path: |
            ${{ env.CANDIDATE_ELF }}
            guest-evidence/evidence.json
            guest-evidence/report.md
          if-no-files-found: error
          retention-days: 90

      - name: Save pinned ZisK provider from main
        if: >-
          always()
          && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
          && steps.zisk-provider-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/zisk-artifacts/libziskos_staticlib.a
          key: ${{ env.ZISK_CACHE_KEY }}

  openvm:
    name: openvm tests-zkevm
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
      && (inputs.backend == 'openvm' || inputs.backend == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      release_artifact_name: ${{ steps.release-artifact.outputs.name }}
    env:
      RESOLVED_MANIFEST: ${{ github.workspace }}/resolved-manifest.json
      SOURCE_COMMIT: ${{ github.sha }}
      STATELESS_SCHEMA: "0x1501"
      ZIG_VERSION: 0.16.0
      OPENVM_VERSION: v2.1.0-preview
      OPENVM_COMMIT: 538c5488130da56c8442d33445efe3c1fe5ea8b8
      OPENVM_RUST_TOOLCHAIN: openvm-1.94.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: eest/consume/uv.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Install pinned OpenVM toolchain
        run: |
          cargo install --locked \
            --git https://github.com/openvm-org/openvm.git \
            --tag "${OPENVM_VERSION}" \
            cargo-openvm
          cargo openvm toolchain install
          rustup run "${OPENVM_RUST_TOOLCHAIN}" rustc -vV

      - name: Resolve tests-zkevm through execution-specs
        run: |
          zig build zkevm-resolve --summary all -- \
            --cache-folder="${RUNNER_TEMP}/execution-spec-tests" \
            --manifest="${RESOLVED_MANIFEST}"

      - name: Build OpenVM host and guest
        run: |
          cargo build \
            --quiet \
            --release \
            --locked \
            --manifest-path guest/runtime/Cargo.toml \
            --package evmz-openvm-host \
            --target-dir "${RUNNER_TEMP}/openvm-host-target"
          zig build guest-openvm \
            -Dguest-payload=stateless-ere \
            "-Dstateless-schema=${STATELESS_SCHEMA}" \
            -Doptimize=ReleaseFast \
            --prefix "${RUNNER_TEMP}/guest" \
            --global-cache-dir "${RUNNER_TEMP}/zig-global-cache" \
            --summary all
          elf="${RUNNER_TEMP}/guest/guest/openvm/evmz-guest-openvm.elf"
          zig build check-guest-elf -- --require-rv64im "${elf}"
          candidate="${GITHUB_WORKSPACE}/stateless-validator-evmz-openvm-${OPENVM_VERSION}.elf"
          install -D -m 0644 "${elf}" "${candidate}"
          {
            echo "OPENVM_ELF=${candidate}"
            echo "OPENVM_HOST=${RUNNER_TEMP}/openvm-host-target/release/evmz-openvm-host"
          } >> "${GITHUB_ENV}"

      - name: Run corpus and produce evidence
        env:
          RELEASE_GATE: ${{ inputs.release_gate }}
        run: |
          args=(
            --executor openvm
            --jobs 2
            --openvm-host "${OPENVM_HOST}"
            --openvm-config "${GITHUB_WORKSPACE}/guest/runtime/openvm/openvm.toml"
            --openvm-elf "${OPENVM_ELF}"
            --evidence-dir "${GITHUB_WORKSPACE}/guest-evidence"
            --corpus-manifest "${RESOLVED_MANIFEST}"
            --source-ref "${SOURCE_COMMIT}"
            --stateless-schema "${STATELESS_SCHEMA}"
            --zig-version "${ZIG_VERSION}"
            --backend-version "${OPENVM_VERSION}"
            --backend-commit "${OPENVM_COMMIT}"
            --backend-toolchain "${OPENVM_RUST_TOOLCHAIN}"
          )
          if [[ "${RELEASE_GATE}" == true ]]; then
            args+=(--strict-evidence)
          fi
          zig build -Doptimize=ReleaseFast zkevm --summary all -- "${args[@]}"

      - name: Write runtime identity
        run: |
          mkdir -p guest-evidence
          {
            echo "OpenVM ${OPENVM_VERSION} (${OPENVM_COMMIT})"
            echo "OpenVM fixture workers 2"
            echo "Rust ${OPENVM_RUST_TOOLCHAIN}"
            sha256sum "${OPENVM_HOST}" "${OPENVM_ELF}"
          } | tee guest-evidence/runtime.txt

      - name: Publish job summary
        if: always() && hashFiles('guest-evidence/report.md') != ''
        run: cat guest-evidence/report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload OpenVM benchmark evidence
        if: always() && !inputs.release_gate
        uses: actions/upload-artifact@v7
        with:
          name: guest-openvm-tests-zkevm-${{ github.run_id }}-${{ github.run_attempt }}
          path: guest-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Name release evidence
        id: release-artifact
        if: success() && inputs.release_gate
        run: echo "name=guest-openvm-strict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload strict release evidence
        if: success() && inputs.release_gate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-artifact.outputs.name }}
          path: |
            ${{ env.OPENVM_ELF }}
            guest-evidence/evidence.json
            guest-evidence/report.md
          if-no-files-found: error
          retention-days: 90

  sp1:
    name: sp1 tests-zkevm
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
      && (inputs.backend == 'sp1' || inputs.backend == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      release_artifact_name: ${{ steps.release-artifact.outputs.name }}
    env:
      RESOLVED_MANIFEST: ${{ github.workspace }}/resolved-manifest.json
      SOURCE_COMMIT: ${{ github.sha }}
      STATELESS_SCHEMA: "0x1501"
      ZIG_VERSION: 0.16.0
      SP1_VERSION: v6.4.0
      SP1_COMMIT: f66b4bff51d0ccff51d152e0f7f66b2ffedf3529
      SP1_PROVIDER_COMMIT: 7929b001303feb6803ce1214557d5ab1f17eee84
      SP1_RUST_TOOLCHAIN: succinct

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: eest/consume/uv.lock

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Install pinned SP1 toolchain
        run: |
          mkdir -p "${HOME}/.sp1/bin"
          curl -fsSL \
            "https://raw.githubusercontent.com/succinctlabs/sp1/${SP1_COMMIT}/sp1up/sp1up" \
            -o "${HOME}/.sp1/bin/sp1up"
          chmod +x "${HOME}/.sp1/bin/sp1up"
          export PATH="${HOME}/.sp1/bin:${PATH}"
          echo "${HOME}/.sp1/bin" >> "${GITHUB_PATH}"
          sp1up -v "${SP1_VERSION}"
          cargo prove --version
          rustup run "${SP1_RUST_TOOLCHAIN}" rustc -vV

      - name: Resolve tests-zkevm through execution-specs
        run: |
          zig build zkevm-resolve --summary all -- \
            --cache-folder="${RUNNER_TEMP}/execution-spec-tests" \
            --manifest="${RESOLVED_MANIFEST}"

      - name: Build SP1 host and guest
        run: |
          cargo build \
            --quiet \
            --release \
            --locked \
            --manifest-path guest/runtime/Cargo.toml \
            --package evmz-sp1-host \
            --target-dir "${RUNNER_TEMP}/sp1-host-target"
          zig build guest-sp1 \
            -Dguest-payload=stateless-ere \
            "-Dstateless-schema=${STATELESS_SCHEMA}" \
            -Doptimize=ReleaseFast \
            --prefix "${RUNNER_TEMP}/guest" \
            --global-cache-dir "${RUNNER_TEMP}/zig-global-cache" \
            --summary all
          elf="${RUNNER_TEMP}/guest/guest/sp1/evmz-guest-sp1.elf"
          zig build check-guest-elf -- --require-rv64im "${elf}"
          candidate="${GITHUB_WORKSPACE}/stateless-validator-evmz-sp1-${SP1_VERSION}.elf"
          install -D -m 0644 "${elf}" "${candidate}"
          {
            echo "SP1_ELF=${candidate}"
            echo "SP1_HOST=${RUNNER_TEMP}/sp1-host-target/release/evmz-sp1-host"
          } >> "${GITHUB_ENV}"

      - name: Run corpus and produce evidence
        env:
          RELEASE_GATE: ${{ inputs.release_gate }}
        run: |
          args=(
            --executor sp1
            --jobs 4
            --sp1-host "${SP1_HOST}"
            --sp1-elf "${SP1_ELF}"
            --evidence-dir "${GITHUB_WORKSPACE}/guest-evidence"
            --corpus-manifest "${RESOLVED_MANIFEST}"
            --source-ref "${SOURCE_COMMIT}"
            --stateless-schema "${STATELESS_SCHEMA}"
            --zig-version "${ZIG_VERSION}"
            --backend-version "${SP1_VERSION}"
            --backend-commit "${SP1_COMMIT}"
            --backend-toolchain "${SP1_RUST_TOOLCHAIN}"
          )
          if [[ "${RELEASE_GATE}" == true ]]; then
            args+=(--strict-evidence)
          fi
          zig build -Doptimize=ReleaseFast zkevm --summary all -- "${args[@]}"

      - name: Write runtime identity
        run: |
          mkdir -p guest-evidence
          {
            echo "SP1 ${SP1_VERSION} (${SP1_COMMIT})"
            echo "SP1 fixture workers 4"
            echo "ERE v0.16.2 provider with SP1 patch ${SP1_PROVIDER_COMMIT}"
            sha256sum "${SP1_HOST}" "${SP1_ELF}"
          } | tee guest-evidence/runtime.txt

      - name: Publish job summary
        if: always() && hashFiles('guest-evidence/report.md') != ''
        run: cat guest-evidence/report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload SP1 benchmark evidence
        if: always() && !inputs.release_gate
        uses: actions/upload-artifact@v7
        with:
          name: guest-sp1-tests-zkevm-${{ github.run_id }}-${{ github.run_attempt }}
          path: guest-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Name release evidence
        id: release-artifact
        if: success() && inputs.release_gate
        run: echo "name=guest-sp1-strict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload strict release evidence
        if: success() && inputs.release_gate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release-artifact.outputs.name }}
          path: |
            ${{ env.SP1_ELF }}
            guest-evidence/evidence.json
            guest-evidence/report.md
          if-no-files-found: error
          retention-days: 90
