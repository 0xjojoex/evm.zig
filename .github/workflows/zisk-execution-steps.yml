# Guest-performance lab. ZisK step counts are deterministic and host-independent,
# so one run per ref is enough: this builds a single guest, runs the pinned
# fixture suite, and compares against the rows archived by the last successful
# `main` run. Step deltas are reported; incomplete runs, emulator crashes, and
# public-output mismatches fail.
name: ZisK execution steps

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Run ID to use as baseline (blank uses the last successful main run)
        required: false
        type: string
      max_steps:
        description: Maximum ZisK steps per fixture
        required: true
        default: "10000000"
        type: string
  push:
    branches: [main]
    paths:
      - build.zig
      - build.zig.zon
      - src/**
      - guest/**
      - eest/**
      - .github/workflows/zisk-execution-steps.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: zisk-execution-steps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: tests-zkevm v0.6.2 execution steps
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ZISK_VERSION: 1.0.0-alpha
      ZISK_COMMIT: 4b9f758fabc4955cac20af837019ccc31b803a46
      ZISK_RUST_TOOLCHAIN: zisk-1.0.0
      FIXTURE_MANIFEST: eest/fixtures/zisk-steps-tests-zkevm-v0.6.2.txt
      FIXTURE_ROOT: ${{ github.workspace }}/.eest/fixtures/tests-zkevm-v0.6.2
      RESULTS_ROOT: ${{ github.workspace }}/zisk-step-results
      MAX_STEPS: ${{ inputs.max_steps || '10000000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve runner paths
        run: |
          {
            echo "ZISK_HOME=${RUNNER_TEMP}/zisk-sdk"
            echo "ZISK_SOURCE=${RUNNER_TEMP}/zisk-source"
            echo "BASELINE_ROOT=${RUNNER_TEMP}/zisk-step-baseline"
          } >> "${GITHUB_ENV}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-riscv64-unknown-elf \
            build-essential \
            clang \
            gcc-riscv64-unknown-elf \
            jq \
            libclang-dev \
            libgmp-dev \
            libgrpc++-dev \
            libomp-dev \
            libopenmpi-dev \
            libpqxx-dev \
            libsecp256k1-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev \
            openmpi-bin \
            openmpi-common \
            pkg-config \
            protobuf-compiler \
            uuid-dev \
            xz-utils

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore zkEVM fixture archive
        uses: actions/cache@v4
        with:
          path: .eest/cache
          key: zisk-steps-tests-zkevm-v0.6.2-${{ hashFiles('eest.lock', 'eest/fixtures/zisk-steps-tests-zkevm-v0.6.2.txt') }}

      - name: Fetch selected tests-zkevm v0.6.2 fixtures
        working-directory: eest
        run: scripts/fetch-eest-zkevm-fixtures.sh --manifest fixtures/zisk-steps-tests-zkevm-v0.6.2.txt

      - name: Install pinned ZisK v1 alpha toolchain
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/0xPolygonHermez/zisk/${ZISK_COMMIT}/ziskup/ziskup" \
            -o "${RUNNER_TEMP}/ziskup"
          chmod +x "${RUNNER_TEMP}/ziskup"
          sudo "${RUNNER_TEMP}/ziskup" \
            --system \
            --version "${ZISK_VERSION}" \
            --prefix "${ZISK_HOME}" \
            --owner "$(id -un):$(id -gn)" \
            --cpu \
            --nokey \
            --yes \
            --force
          PATH="${HOME}/.cargo/bin:${PATH}" \
            ZISK_HOME="${ZISK_HOME}" \
            "${ZISK_HOME}/bin/cargo-zisk" toolchain install \
              --toolchain-version "${ZISK_RUST_TOOLCHAIN}"
          zisk_sysroot="$(rustup run zisk rustc --print sysroot)"
          host_cargo="$(rustup which cargo)"
          test -x "${host_cargo}"
          test ! -e "${zisk_sysroot}/bin/cargo"
          ln -s "${host_cargo}" "${zisk_sysroot}/bin/cargo"
          {
            "${ZISK_HOME}/bin/cargo-zisk" --version
            rustup run zisk rustc -vV
            rustup run zisk rustc --print cfg --target riscv64ima-zisk-zkvm-elf
          } | tee zisk-version.txt
          if rustup run zisk rustc --print cfg --target riscv64ima-zisk-zkvm-elf \
            | grep -Eq 'target_feature="(zbb|zbkb|zbs)"'; then
            echo "error: incompatible ZisK Rust target enables unsupported bit-manipulation extensions" >&2
            exit 1
          fi
          echo "${ZISK_HOME}/bin" >> "${GITHUB_PATH}"

      - name: Prepare pinned ZisK source
        run: |
          git init "${ZISK_SOURCE}"
          git -C "${ZISK_SOURCE}" remote add origin https://github.com/0xPolygonHermez/zisk.git
          git -C "${ZISK_SOURCE}" fetch --depth 1 origin "${ZISK_COMMIT}"
          git -C "${ZISK_SOURCE}" checkout --detach FETCH_HEAD
          test "$(git -C "${ZISK_SOURCE}" rev-parse HEAD)" = "${ZISK_COMMIT}"

      - name: Restore Rust build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ${{ runner.temp }}/zisk-source/target
          key: zisk-v1-alpha-rust-1.0-rv64ima-upstream-${{ runner.os }}

      - name: Build pinned ZisK artifacts
        id: zisk
        working-directory: ${{ runner.temp }}/zisk-source
        run: |
          cargo build --locked --release -p ziskemu
          PATH="${HOME}/.cargo/bin:${PATH}" \
            ZISK_HOME="${ZISK_HOME}" \
            "${ZISK_HOME}/bin/cargo-zisk" build --release -p ziskos-staticlib
          provider="$(find target/elf -type f -name libziskos_staticlib.a -print -quit)"
          test -n "${provider}"
          {
            echo "ziskemu=${ZISK_SOURCE}/target/release/ziskemu"
            echo "provider=${ZISK_SOURCE}/${provider}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build stateless guest
        env:
          PROVIDER: ${{ steps.zisk.outputs.provider }}
        run: |
          zig build guest-zisk \
            -Dguest-payload=stateless-ere \
            -Doptimize=ReleaseFast \
            "-Dziskos-staticlib=${PROVIDER}" \
            --prefix "${RUNNER_TEMP}/guest" \
            --global-cache-dir "${RUNNER_TEMP}/zig-global-cache" \
            --summary all
          elf="${RUNNER_TEMP}/guest/guest/zisk/evmz-guest-zisk.elf"
          if riscv64-unknown-elf-objdump -d "${elf}" \
            | grep -E '[[:space:]]rev8[[:space:]]' >/dev/null; then
            echo "error: ZisK v1 alpha guest provider introduced unsupported rev8: ${elf}" >&2
            exit 1
          fi

      - name: Run fixture suite
        env:
          ZISKEMU: ${{ steps.zisk.outputs.ziskemu }}
        run: |
          fixtures=()
          while IFS= read -r fixture || [[ -n "${fixture}" ]]; do
            fixture="${fixture%$'\r'}"
            [[ -z "${fixture}" || "${fixture}" == \#* ]] && continue
            fixtures+=("${FIXTURE_ROOT}/${fixture}")
          done < "${FIXTURE_MANIFEST}"

          zig build zkevm-ere-bench --summary all -- \
            --engine zisk \
            --report-only \
            --output-folder "${RESULTS_ROOT}" \
            --ziskemu "${ZISKEMU}" \
            --zisk-elf "${RUNNER_TEMP}/guest/guest/zisk/evmz-guest-zisk.elf" \
            --zisk-work-dir "${RUNNER_TEMP}/zisk-runs" \
            --zisk-max-steps "${MAX_STEPS}" \
            "${fixtures[@]}"

      - name: Archive current rows
        uses: actions/upload-artifact@v4
        with:
          name: zisk-step-results
          path: ${{ env.RESULTS_ROOT }}
          if-no-files-found: error
          retention-days: 90

      # The last successful `main` run is the reference point. A push to `main`
      # therefore compares against the previous `main` run, and every other run
      # compares against whatever `main` last archived.
      - name: Resolve baseline run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          run_id="${BASELINE_RUN_ID}"
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/zisk-execution-steps.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
          fi
          ref="none"
          if [[ -n "${run_id}" ]]; then
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')"
          else
            echo "no successful main run found; reporting absolute step counts"
          fi
          {
            echo "run_id=${run_id}"
            echo "ref=${ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download baseline rows
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: zisk-step-results
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.BASELINE_ROOT }}

      - name: Compare execution steps and public outputs
        id: comparison
        continue-on-error: true
        run: |
          python3 eest/scripts/report-zisk-steps.py \
            --current "${RESULTS_ROOT}" \
            --baseline "${BASELINE_ROOT}" \
            --output zisk-step-report.md \
            --current-ref "${GITHUB_SHA}" \
            --baseline-ref "${{ steps.baseline.outputs.ref }}"

      - name: Publish job summary
        if: always() && hashFiles('zisk-step-report.md') != ''
        run: cat zisk-step-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload execution-step report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zisk-step-report-${{ github.sha }}
          path: |
            zisk-step-report.md
            zisk-version.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete public-output parity
        if: always()
        env:
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: test "${COMPARISON_OUTCOME}" = success
