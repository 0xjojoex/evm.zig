name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: Native Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512

      - name: Run native verification
        run: >-
          zig build
          test-evmz-native-all
          test-packages
          guest-payload-test
          guest-payload-abi-check
          fmt-check
          tidy
          -j2
          --summary all

  zkvm-profile-test:
    name: zkVM-profile semantic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512

      - name: Run zkVM-profile semantic tests
        run: zig build test-evmz-zkvm-all -j2 --summary all

  evmc-test:
    name: EVMC compatibility package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512

      - name: Build and test EVMC
        working-directory: pkg/evmc
        run: zig build ci -Doptimize=ReleaseFast -j2 --summary all

  fuzz:
    name: Fuzz pure-Zig units
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512

      - name: Fuzz uint256
        run: zig build fuzz-uint256 --fuzz=200K --summary all

      - name: Fuzz modexp
        run: zig build fuzz-modexp --fuzz=10K --summary all

      - name: Fuzz RLP
        run: zig build fuzz-rlp --fuzz=100K --summary all

      - name: Fuzz MPT
        run: zig build fuzz-mpt --fuzz=25K --summary all

  cross-compile:
    name: Cross compile ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
          - target: aarch64-linux-musl
          - target: riscv64-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: ${{ github.event_name != 'pull_request' }}
          cache-size-limit: 512
          cache-key: ${{ matrix.target }}

      - name: Record target
        run: |
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "target=${{ matrix.target }}"
            echo
            uname -a
            echo
            lscpu
            echo
            zig version
          } | tee portability-${{ matrix.target }}.txt

      - name: Cross compile
        env:
          TARGET: ${{ matrix.target }}
        run: zig build -Dtarget="${TARGET}" -Doptimize=ReleaseFast --summary all

      - name: Cross compile EVMC artifacts
        if: matrix.target == 'aarch64-linux-musl'
        working-directory: pkg/evmc
        env:
          TARGET: ${{ matrix.target }}
        run: zig build -Dtarget="${TARGET}" -Doptimize=ReleaseFast --summary all
