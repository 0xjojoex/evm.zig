# Execute-only SP1 guest-performance lane. It consumes the released zkEVM SDK,
# builds one stateless Zig guest, and archives ERE-shaped rows for the pinned
# tests-zkevm corpus. No proving key or proof generation is involved.
# Correctness gates the run: a nonzero guest exit or a public-output mismatch
# fails the fixture suite. Cycle counts and public outputs are compared with
# the last successful main run and published in the Actions job summary.
name: SP1 execution cycles

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Run ID to use as baseline (blank uses the last successful main run)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - build.zig
      - build.zig.zon
      - src/**
      - guest/**
      - eest/**
      - .github/workflows/sp1-execution-cycles.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sp1-execution-cycles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: tests-zkevm v0.6.2 execution cycles
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SP1_VERSION: v6.3.1
      SP1_SDK_SHA256: ef9124009aa88a5039f003bda51fc5210888cc6aa878320aac04666a3389bfb8
      FIXTURE_MANIFEST: eest/fixtures/zisk-steps-tests-zkevm-v0.6.2.txt
      FIXTURE_ROOT: ${{ github.workspace }}/.eest/fixtures/tests-zkevm-v0.6.2
      RESULTS_ROOT: ${{ github.workspace }}/sp1-cycle-results

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve runner paths
        run: |
          {
            echo "SP1_SDK_ROOT=${RUNNER_TEMP}/sp1-sdk"
            echo "SP1_HOST_TARGET=${RUNNER_TEMP}/sp1-host-target"
            echo "BASELINE_ROOT=${RUNNER_TEMP}/sp1-cycle-baseline"
          } >> "${GITHUB_ENV}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-unknown-elf

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Restore fixture archive
        uses: actions/cache@v4
        with:
          path: .eest/cache
          key: sp1-cycles-tests-zkevm-v0.6.2-${{ hashFiles('eest.lock', 'eest/fixtures/zisk-steps-tests-zkevm-v0.6.2.txt') }}

      - name: Fetch selected tests-zkevm v0.6.2 fixtures
        working-directory: eest
        run: scripts/fetch-eest-zkevm-fixtures.sh --manifest fixtures/zisk-steps-tests-zkevm-v0.6.2.txt

      - name: Download pinned SP1 zkEVM SDK
        run: |
          archive="${RUNNER_TEMP}/zkevm-sdk-${SP1_VERSION}.tar.gz"
          curl -fsSL \
            "https://github.com/succinctlabs/sp1/releases/download/${SP1_VERSION}/zkevm-sdk-${SP1_VERSION}.tar.gz" \
            -o "${archive}"
          echo "${SP1_SDK_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "${SP1_SDK_ROOT}"
          tar -xzf "${archive}" -C "${SP1_SDK_ROOT}" --strip-components=1
          test -f "${SP1_SDK_ROOT}/libzkevm.a"

      - name: Restore SP1 host build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ${{ runner.temp }}/sp1-host-target
          key: sp1-host-v6.3.1-${{ runner.os }}-${{ hashFiles('guest/runtime/sp1/host/Cargo.lock') }}

      - name: Build execute-only SP1 host
        run: |
          cargo build \
            --quiet \
            --release \
            --locked \
            --manifest-path guest/runtime/sp1/host/Cargo.toml \
            --target-dir "${SP1_HOST_TARGET}"

      - name: Build stateless SP1 guest
        run: |
          zig build guest-sp1 \
            -Dguest-payload=stateless-ere \
            -Doptimize=ReleaseFast \
            "-Dsp1-staticlib=${SP1_SDK_ROOT}/libzkevm.a" \
            --prefix "${RUNNER_TEMP}/guest" \
            --global-cache-dir "${RUNNER_TEMP}/zig-global-cache" \
            --summary all
          elf="${RUNNER_TEMP}/guest/guest/sp1/evmz-guest-sp1.elf"
          if riscv64-unknown-elf-objdump -d "${elf}" \
            | grep -E '[[:space:]](amo|lr\.|sc\.)' >/dev/null; then
            echo "error: SP1 RV64IM guest contains unsupported atomic instructions" >&2
            exit 1
          fi

      - name: Run fixture suite
        run: |
          fixtures=()
          while IFS= read -r fixture || [[ -n "${fixture}" ]]; do
            fixture="${fixture%$'\r'}"
            [[ -z "${fixture}" || "${fixture}" == \#* ]] && continue
            fixtures+=("${FIXTURE_ROOT}/${fixture}")
          done < "${FIXTURE_MANIFEST}"

          zig build zkevm-ere-bench --summary all -- \
            --engine sp1 \
            --report-only \
            --output-folder "${RESULTS_ROOT}" \
            --sp1-host "${SP1_HOST_TARGET}/release/evmz-sp1-host" \
            --sp1-elf "${RUNNER_TEMP}/guest/guest/sp1/evmz-guest-sp1.elf" \
            --sp1-work-dir "${RUNNER_TEMP}/sp1-runs" \
            "${fixtures[@]}"

      - name: Archive execution rows
        uses: actions/upload-artifact@v4
        with:
          name: sp1-cycle-results
          path: ${{ env.RESULTS_ROOT }}
          if-no-files-found: error
          retention-days: 90

      - name: Resolve baseline run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          run_id="${BASELINE_RUN_ID}"
          if [[ -z "${run_id}" ]]; then
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/sp1-execution-cycles.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
          fi
          ref="none"
          if [[ -n "${run_id}" ]]; then
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')"
          else
            echo "no successful main run found; reporting absolute cycle counts"
          fi
          {
            echo "run_id=${run_id}"
            echo "ref=${ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download baseline rows
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sp1-cycle-results
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.BASELINE_ROOT }}

      - name: Compare execution cycles and public outputs
        id: comparison
        continue-on-error: true
        run: |
          python3 eest/scripts/report-zisk-steps.py \
            --backend sp1 \
            --current "${RESULTS_ROOT}" \
            --baseline "${BASELINE_ROOT}" \
            --output sp1-cycle-report.md \
            --current-ref "${GITHUB_SHA}" \
            --baseline-ref "${{ steps.baseline.outputs.ref }}" \
            --sp1 "${SP1_VERSION}"

      - name: Publish job summary
        if: always() && hashFiles('sp1-cycle-report.md') != ''
        run: cat sp1-cycle-report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload execution-cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp1-cycle-report-${{ github.sha }}
          path: sp1-cycle-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete public-output parity
        if: always()
        env:
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: test "${COMPARISON_OUTCOME}" = success
